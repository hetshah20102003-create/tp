version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# Custom headers for static assets
customHeaders:
  - pattern: '**/*.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: 'firebase-messaging-sw.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
      - key: 'Service-Worker-Allowed'
        value: '/'
      - key: 'Cache-Control'
        value: 'no-cache, no-store, must-revalidate'
  - pattern: '**/*.mp3'
    headers:
      - key: 'Content-Type'
        value: 'audio/mpeg'
      - key: 'Cache-Control'
        value: 'public, max-age=31536000'
  - pattern: '**/*.png'
    headers:
      - key: 'Content-Type'
        value: 'image/png'
      - key: 'Cache-Control'
        value: 'public, max-age=31536000'
  - pattern: '**/*.jpg'
    headers:
      - key: 'Content-Type'
        value: 'image/jpeg'
      - key: 'Cache-Control'
        value: 'public, max-age=31536000'

