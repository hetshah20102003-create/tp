<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unified Business Suite — Dashboard</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:1rem 1.5rem; background:var(--card); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
    h1 { font-size:1.2rem; margin:0; }
    main { padding:1.5rem; max-width:1100px; margin:0 auto; }
    .login { display:flex; gap:.5rem; flex-wrap:wrap; }
    input, button { padding:.5rem .75rem; border-radius:6px; border:1px solid #334155; background:#0b1220; color:var(--text); }
    button { background:var(--accent); color:#06283d; border:none; font-weight:600; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin-bottom:1.5rem; }
    .kpi { background:var(--card); padding:1.25rem; border-radius:12px; }
    .kpi .label { color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; }
    .kpi .value { font-size:1.8rem; font-weight:700; margin-top:.4rem; color:var(--accent); }
    .status { color:var(--muted); font-size:.85rem; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>📊 Unified Business Suite</h1>
    <div class="login">
      <input id="user" placeholder="username" value="admin" />
      <input id="pass" type="password" placeholder="password" value="admin123" />
      <button onclick="login()">Sign in</button>
    </div>
  </header>
  <main>
    <p class="status" id="status">Sign in to load live KPIs. Try admin / hr / accountant.</p>
    <div class="grid" id="kpis"></div>
    <p class="status">API docs: <a href="/docs">/docs</a> · Health: <a href="/health">/health</a></p>
  </main>

  <script>
    let token = null;
    const KPI_LABELS = {
      active_headcount: "Active Headcount",
      pending_leave_requests: "Pending Leave",
      total_payroll_cost: "Payroll Cost",
      total_invoiced: "Total Invoiced",
      outstanding_receivables: "Outstanding AR",
      asset_account_balance: "Asset Balance",
    };

    async function login() {
      const body = new URLSearchParams();
      body.set("username", document.getElementById("user").value);
      body.set("password", document.getElementById("pass").value);
      const res = await fetch("/auth/token", { method: "POST", body });
      if (!res.ok) { setStatus("Login failed."); return; }
      token = (await res.json()).access_token;
      setStatus("Signed in. Loading KPIs…");
      loadKpis();
    }

    async function loadKpis() {
      const res = await fetch("/reports/kpis", { headers: { Authorization: "Bearer " + token } });
      if (!res.ok) { setStatus("Could not load KPIs."); return; }
      const data = await res.json();
      const grid = document.getElementById("kpis");
      grid.innerHTML = "";
      for (const [k, v] of Object.entries(data)) {
        const money = k.includes("payroll") || k.includes("invoiced") || k.includes("receivables") || k.includes("balance");
        const value = money ? "₹" + Number(v).toLocaleString() : v;
        grid.insertAdjacentHTML("beforeend",
          `<div class="kpi"><div class="label">${KPI_LABELS[k] || k}</div><div class="value">${value}</div></div>`);
      }
      setStatus("Live as of " + new Date().toLocaleTimeString());
    }

    function setStatus(msg) { document.getElementById("status").textContent = msg; }
  </script>
</body>
</html>
